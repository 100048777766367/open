name: Open Sovereign Dissector Lifecycle
on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '30 */4 * * *'
permissions:
  contents: write
jobs:
  run-dissector:
    runs-on: ubuntu-latest
    steps:
      - name: Kéo mã nguồn
        run: git clone --depth 1 https://github.com/${{ github.repository }}.git .
      - name: Thiết lập môi trường Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Vận hành động cơ giải phẫu
        run: python -B open_engine.py
